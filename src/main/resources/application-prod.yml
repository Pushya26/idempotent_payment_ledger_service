spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8080}

logging:
  level:
    com.pushya.ledger: INFO
    org.springframework.web: WARN

management:
  endpoint:
    health:
      show-details: when-authorized
