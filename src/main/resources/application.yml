spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: ledger
    password: ledger
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  docker:
    compose:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  shutdown: graceful
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.pushya.ledger: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"

ledger:
  idempotency:
    claim-ttl-seconds: 30
    result-ttl-hours: 24
